# Runs the unit tests, the end-to-end tests and a start of the packaged app on every push and pull request.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # foundry-local-sdk's install script fetches ONNX Runtime from NuGet: nuget.org only, never its nightly-feed
  # fallback (test/foundry-natives.test.js checks what arrived).
  FOUNDRY_LOCAL_NUGET_FEEDS: https://api.nuget.org/v3/index.json

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      # The tests run in plain Node; the Electron binary is only needed to build.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run i18n:check

  e2e:
    # The real app with fake keys, a fake paster, a fake speech engine and a fake microphone (src/main/e2e.js).
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1' # Playwright drives Electron; it needs no browsers of its own
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:e2e

  packaged:
    # The packed app, as the installer and the portable exe ship it: only it lacks
    # package.json's "build" and dev parts (1.3.0-1.5.0 broke there and nowhere else).
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build the unpacked app
        run: npx electron-builder --win dir --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Check the packaged app starts
        run: node scripts/smoke-packaged.js dist/win-unpacked
