name: Language problem
description: Words in your language come out wrong, in another language, or voice commands don't work in it.
labels: [language]
body:
  - type: input
    id: language
    attributes:
      label: Language
      description: The language you spoke, and the languages chosen in Settings.
      placeholder: Croatian (chosen - Croatian, English)
    validations:
      required: true
  - type: dropdown
    id: engine
    attributes:
      label: Speech engine
      options:
        - On this PC - Tiny
        - On this PC - Base
        - On this PC - Small
        - On this PC - Large v3 Turbo
        - Cloud (Groq or another provider)
    validations:
      required: true
  - type: textarea
    id: said
    attributes:
      label: What you said
      description: A sample sentence, written the way you said it. Please don't paste anything private.
    validations:
      required: true
  - type: textarea
    id: typed
    attributes:
      label: What Pauli Speaks typed
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the About page.
      placeholder: 1.3.0
